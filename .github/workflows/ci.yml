name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        shell: pwsh
        run: ./mvnw.ps1 -B '-Dstyle.color=never' verify
      - name: Repository secret-pattern scan
        shell: pwsh
        run: ./scripts/check-repository.ps1
